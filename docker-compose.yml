# Uruchamia serwis wizyjny dartscore jako OSOBNY kontener (wariant alternatywny).
#
# Uwaga: jeśli Twój backend to Python/FastAPI, zwykle NIE potrzebujesz tego —
# wepnij router bezpośrednio (service/router.py -> app.include_router(...)).
# Ten compose jest przydatny, gdy chcesz dartscore jako niezależny proces; Twoja
# apka woła go pod http://dartscore:8000 (sieć compose) lub http://localhost:8000.
#
# Start:  docker compose up --build
services:
  dartscore:
    build: .
    image: dartscore:latest
    ports:
      - "8000:8000"
    volumes:
      # Trwały plik kalibracji — liczysz raz, serwis wczytuje przy starcie.
      - dartscore-data:/data
      # Podmiana geometrii/konfiguracji bez przebudowy obrazu.
      - ./config:/app/config:ro
    environment:
      DARTSCORE_CALIBRATION: /data/calibration.json
    restart: unless-stopped

  # --- PRZYKŁAD: tu dołącz swój backend (np. FastAPI), jeśli go konteneryzujesz -
  # backend:
  #   build: ./path-do-twojego-backendu
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     # Adres serwisu wizyjnego, gdy wołasz go po HTTP zamiast wpinać router.
  #     DARTS_SERVICE_URL: http://dartscore:8000
  #   depends_on:
  #     - dartscore

volumes:
  dartscore-data:
